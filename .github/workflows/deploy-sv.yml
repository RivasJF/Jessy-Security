name: deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run tests
      run: mvn -B test --file pom.xml

    - name: Set short SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64
        tags: |
          ${{ secrets.DOCKER_HUB_USER }}/jessy-security:latest
          ${{ secrets.DOCKER_HUB_USER }}/jessy-security:${{ steps.vars.outputs.sha_short }}

    - name: Tailscale Conection
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci

    - name: Connect ts
      run: |
        ssh -o "StrictHostKeyChecking no" ${{ secrets.USER_SERVER }}@${{ secrets.HOST_SERVER }} "
        cd ${{ secrets.DEPLOY_PATH }} &&
          IMAGE_TAG=${{ steps.vars.outputs.sha_short }} docker compose pull api &&
          IMAGE_TAG=${{ steps.vars.outputs.sha_short }} docker compose up -d --no-deps api &&
          docker image prune -af
        "
